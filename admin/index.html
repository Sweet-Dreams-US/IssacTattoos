<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#0E0D0C" />
<meta name="robots" content="noindex,nofollow" />
<title>Reliquary · Studio Panel</title>
<link rel="icon" href="../assets/svg/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- =========================================================
     LOGIN GATE
========================================================= -->
<div class="gate" id="gate">
  <div class="gate__card">
    <svg class="gate__sigil" viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1">
      <path d="M30 4 C 38 10, 52 18, 54 28 C 56 40, 50 50, 30 56 C 10 50, 4 40, 6 28 C 8 18, 22 10, 30 4 Z" />
      <path d="M30 22 C 26 16, 18 16, 18 24 C 18 32, 30 40, 30 40 C 30 40, 42 32, 42 24 C 42 16, 34 16, 30 22 Z" />
    </svg>
    <div class="gate__word">RELIQUARY</div>
    <div class="gate__sub">Studio Panel · Staff Only</div>
    <form class="gate__form" id="gateForm">
      <label for="gatePass">Passcode</label>
      <input type="password" id="gatePass" autocomplete="off" placeholder="••••••••" />
      <button type="submit">Enter the Studio</button>
      <p class="gate__err" id="gateErr" hidden>Incorrect passcode.</p>
      <p class="gate__hint">Demo passcode — <strong>roque</strong></p>
    </form>
  </div>
</div>

<!-- =========================================================
     APP SHELL
========================================================= -->
<div class="app" id="app" hidden>

  <aside class="side" id="side">
    <a class="side__brand" href="../index.html">
      <svg viewBox="0 0 60 60" fill="none" stroke="currentColor" stroke-width="1">
        <path d="M30 4 C 38 10, 52 18, 54 28 C 56 40, 50 50, 30 56 C 10 50, 4 40, 6 28 C 8 18, 22 10, 30 4 Z" />
        <path d="M30 22 C 26 16, 18 16, 18 24 C 18 32, 30 40, 30 40 C 30 40, 42 32, 42 24 C 42 16, 34 16, 30 22 Z" />
      </svg>
      <span>RELIQUARY<small>STUDIO PANEL</small></span>
    </a>

    <nav class="side__nav" id="nav">
      <a href="#dashboard" data-view="dashboard">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#requests" data-view="requests">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 4h16v12H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg>
        <span>Requests</span><i class="side__count" id="cntRequests"></i>
      </a>
      <a href="#upcoming" data-view="upcoming">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="16"/><path d="M3 9h18M8 3v4M16 3v4"/><circle cx="12" cy="14" r="2.4"/></svg>
        <span>Upcoming</span><i class="side__count" id="cntUpcoming"></i>
      </a>
      <a href="#completed" data-view="completed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
        <span>Completed</span>
      </a>
      <a href="#calendar" data-view="calendar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="3" y="5" width="18" height="16"/><path d="M3 10h18M8 3v4M16 3v4M7 14h3v3H7z"/></svg>
        <span>Calendar</span>
      </a>
      <a href="#staff" data-view="staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="9" cy="8" r="3.4"/><path d="M3 20c0-3.5 3-5.5 6-5.5s6 2 6 5.5"/><circle cx="17.5" cy="9" r="2.6"/><path d="M16 14.4c3 .3 5 2.3 5 5.6"/></svg>
        <span>Staff</span>
      </a>
      <a href="#analytics" data-view="analytics">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 20V4M4 20h16"/><path d="M8 17v-5M13 17V8M18 17v-8"/></svg>
        <span>Analytics</span>
      </a>
      <a href="#accounting" data-view="accounting">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="3" width="16" height="18"/><path d="M8 7h8M8 11h8M8 15h5"/></svg>
        <span>Accounting</span>
      </a>
      <a href="#settings" data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg>
        <span>Settings</span>
      </a>
    </nav>

    <button class="side__out" id="signOut">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M14 4H6v16h8M10 12h10M17 8l4 4-4 4"/></svg>
      <span>Sign out</span>
    </button>
  </aside>

  <div class="main">
    <header class="top">
      <button class="top__menu" id="menuToggle" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <div class="top__titles">
        <h1 id="viewTitle">Dashboard</h1>
        <p id="viewSub">—</p>
      </div>
      <div class="top__meta">
        <span class="top__date" id="topDate">—</span>
        <span class="top__who">Isaac Roque</span>
      </div>
    </header>
    <main class="view" id="view"><!-- rendered by admin.js --></main>
  </div>

  <div class="scrim" id="scrim"></div>
</div>

<script src="admin.js" defer></script>
</body>
</html>
